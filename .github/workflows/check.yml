name: check

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code@2.1.296 && claude --version
      - name: Validate the marketplace
        run: claude plugin validate .claude-plugin/marketplace.json
      - name: Validate and test every mod
        run: |
          for manifest in plugins/*/.claude-plugin/plugin.json; do
            mod=${manifest%/.claude-plugin/plugin.json}
            claude plugin validate "$mod"
            claude plugin test "$mod"
          done
